<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0d1b2a"/>
      <stop offset="80%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4facfe" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1.5" fill="#00f2fe" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulseRing {
      0% { r: 110px; stroke-opacity: 0.5; stroke-dashoffset: 0; }
      50% { r: 130px; stroke-opacity: 0.15; stroke-dashoffset: 60; }
      100% { r: 110px; stroke-opacity: 0.5; stroke-dashoffset: 120; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -360; }
    }
    @keyframes waveFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes badgeGlow {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .orb-anim { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .dash-anim { animation: dashCycle 14s linear infinite; }
    .float-badge { animation: waveFloat 5s ease-in-out infinite; }
    .badge-glow { animation: badgeGlow 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-anim">
    <circle cx="180" cy="80" r="160" fill="#00f2fe" filter="url(#glow)" opacity="0.15"/>
    <circle cx="1060" cy="280" r="170" fill="#7928ca" filter="url(#glow)" opacity="0.18"/>
    <circle cx="980" cy="90" r="130" fill="#4facfe" filter="url(#glow)" opacity="0.12"/>
  </g>

  <!-- Animated Dynamic Orbit Lines & Data Flows in Background -->
  <g opacity="0.3" class="dash-anim">
    <ellipse cx="600" cy="180" rx="540" ry="140" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="12 18"/>
    <ellipse cx="600" cy="180" rx="460" ry="110" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="8 14"/>
  </g>

  <!-- Right Visual: PKI Security Lock & Key Token Graphic (Positioned away from text) -->
  <g transform="translate(1000, 175)">
    <!-- Security Shield Background -->
    <path d="M 0 -75 L 65 -45 L 65 30 C 65 75 0 100 0 100 C 0 100 -65 75 -65 30 L -65 -45 Z" fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Lock Body -->
    <rect x="-24" y="-5" width="48" height="40" rx="8" fill="#1b263b" stroke="#00f2fe" stroke-width="2"/>
    <!-- Lock Shackle -->
    <path d="M -15 -5 L -15 -22 C -15 -34 15 -34 15 -22 L 15 -5" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="5" fill="#00f2fe"/>
    <path d="M -2 15 L 2 15 L 3 24 L -3 24 Z" fill="#00f2fe"/>
    <!-- Key Ring Accent -->
    <circle cx="45" cy="-20" r="14" fill="none" stroke="#fda085" stroke-width="2.5" opacity="0.8"/>
    <path d="M 45 -6 L 45 28 L 52 28 M 45 18 L 50 18" fill="none" stroke="#fda085" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Animated Floating Category Badges in Upper & Right Space -->
  <g class="float-badge" transform="translate(80, 52)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0d1b2a" stroke="#00f2fe" stroke-width="1.2" opacity="0.85"/>
    <circle cx="14" cy="13" r="4" fill="#00f2fe" class="badge-glow"/>
    <text x="26" y="17" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">X.509 &amp; PKI</text>
  </g>

  <g class="float-badge" transform="translate(225, 52)">
    <rect x="0" y="0" width="155" height="26" rx="13" fill="#0d1b2a" stroke="#4facfe" stroke-width="1.2" opacity="0.85"/>
    <circle cx="14" cy="13" r="4" fill="#4facfe" class="badge-glow"/>
    <text x="26" y="17" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ACME AUTOMATION</text>
  </g>

  <g class="float-badge" transform="translate(395, 52)">
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#0d1b2a" stroke="#f6d365" stroke-width="1.2" opacity="0.85"/>
    <circle cx="14" cy="13" r="4" fill="#f6d365" class="badge-glow"/>
    <text x="26" y="17" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">MACHINE IDENTITIES</text>
  </g>

  <g class="float-badge" transform="translate(575, 52)">
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#0d1b2a" stroke="#a18cd1" stroke-width="1.2" opacity="0.85"/>
    <circle cx="14" cy="13" r="4" fill="#a18cd1" class="badge-glow"/>
    <text x="26" y="17" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SECRETS &amp; VAULT</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Titles & Descriptions (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(80, 120)">
    <!-- Small Category Label -->
    <text x="0" y="24" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">
      ENTERPRISE CLM &bull; OPEN-SOURCE PKI &bull; TLS / SSL
    </text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Certificate &amp; Key Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#90e0ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      Curated directory of enterprise CLM SaaS platforms, open-source CAs &amp; ACME automation
    </text>

    <!-- Footer Stats / Keyword Pills in Foreground -->
    <g transform="translate(0, 155)">
      <!-- Pill 1: Total Stars -->
      <rect x="0" y="0" width="170" height="32" rx="8" fill="#1b263b" fill-opacity="0.9" stroke="#4facfe" stroke-width="1.2"/>
      <text x="14" y="21" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⭐ 180,000+ Stars</text>

      <!-- Pill 2: Ecosystem Breakdown -->
      <rect x="185" y="0" width="220" height="32" rx="8" fill="#1b263b" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1.2"/>
      <text x="199" y="21" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ 20+ Open-Source Projects</text>

      <!-- Pill 3: Enterprise Leaders -->
      <rect x="420" y="0" width="200" height="32" rx="8" fill="#1b263b" fill-opacity="0.9" stroke="#fda085" stroke-width="1.2"/>
      <text x="434" y="21" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🏢 10 Enterprise SaaS Leaders</text>

      <!-- Pill 4: Zero Trust & Post-Quantum -->
      <rect x="635" y="0" width="180" height="32" rx="8" fill="#1b263b" fill-opacity="0.9" stroke="#a18cd1" stroke-width="1.2"/>
      <text x="649" y="21" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚛️ PQC &amp; Zero Trust Ready</text>
    </g>
  </g>
</svg>
